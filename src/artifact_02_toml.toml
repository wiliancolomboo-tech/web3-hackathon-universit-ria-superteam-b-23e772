[package]
name = "bolsa_stream"
version = "0.1.0"
description = "Institutional Academic Grant & Micro-Stipend Streaming Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bolsa_stream"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1" }